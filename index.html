<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mundo Vivo 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:10px;right:10px;z-index:5;color:white;background:#07131dcc;border-radius:15px;padding:10px;font-size:13px;backdrop-filter:blur(7px)}
#hud b{color:#7fffd4}
#joy{position:fixed;left:22px;bottom:35px;width:145px;height:145px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff66;z-index:10}
#stick{position:absolute;left:42px;top:42px;width:61px;height:61px;border-radius:50%;background:#fff9;border:2px solid white}
#run{position:fixed;right:25px;bottom:55px;width:85px;height:85px;border-radius:50%;z-index:10;border:2px solid white;background:#07131dcc;color:white;font-size:30px;font-weight:bold}
#help{position:fixed;right:15px;top:100px;z-index:5;background:#07131dcc;color:white;border:0;border-radius:12px;padding:8px 12px}
#msg{position:fixed;left:50%;bottom:145px;transform:translateX(-50%);z-index:20;background:#000c;color:white;padding:9px 15px;border-radius:18px;display:none}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
<b>ð MUNDO VIVO 3D</b><br>
ð¤ TÃ &nbsp; â¤ï¸ <span id="salud">100</span>% &nbsp; ð <span id="comida">10</span>
&nbsp; ð§ <span id="agua">10</span><br>
ð¥ Habitantes: <span id="people">80</span> &nbsp; ð  Casas: <span id="houses">0</span>
&nbsp; ð Autos: <span id="cars">0</span> &nbsp; ð Animales: <span id="animals">0</span>
</div>

<button id="help">ð® CÃ³mo jugar</button>
<div id="joy"><div id="stick"></div></div>
<button id="run">ð</button>
<div id="msg"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82cfff);
scene.fog=new THREE.Fog(0x82cfff,55,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfe9ff,0x52734d,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(70,100,50); sun.castShadow=true; scene.add(sun);

const clock=new THREE.Clock();
const people=[],cars=[],animals=[];
let running=false;
let joyX=0,joyY=0;
let day=0;

function box(w,h,d,color){
 const m=new THREE.MeshStandardMaterial({color});
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.castShadow=o.receiveShadow=true; return o;
}
function cyl(r,h,color){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),new THREE.MeshStandardMaterial({color}));
 o.castShadow=o.receiveShadow=true; return o;
}
function tree(x,z,s=1){
 const g=new THREE.Group();
 const trunk=cyl(.28,2.2,0x70452d); trunk.position.y=1.1; g.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.45,12,10),new THREE.MeshStandardMaterial({color:0x27823a}));
 crown.position.y=2.7; crown.castShadow=true; g.add(crown);
 g.position.set(x,0,z); g.scale.setScalar(s); scene.add(g);
}
function house(x,z){
 const g=new THREE.Group();
 const body=box(6,3.5,6,0xe9d6b2); body.position.y=1.75; g.add(body);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(4.7,2.2,4),new THREE.MeshStandardMaterial({color:0x8e3e31}));
 roof.rotation.y=Math.PI/4; roof.position.y=4.6; roof.scale.z=.72; g.add(roof);
 const door=box(1.1,2,.12,0x5a3826); door.position.set(0,1,-3.05); g.add(door);
 const win=box(1.2,1.1,.12,0x6bbce5); win.position.set(-2,2,-3.08); g.add(win);
 g.position.set(x,0,z); scene.add(g);
}
function road(x,z,w,d){
 const r=box(w,.08,d,0x3f4348); r.position.set(x,.03,z); scene.add(r);
}
function person(x,z){
 const g=new THREE.Group();
 const body=box(.65,1.25,.45,0x2366a8); body.position.y=1.35; g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),new THREE.MeshStandardMaterial({color:0xf0bf98}));
 head.position.y=2.25; g.add(head);
 const l=box(.18,.9,.18,0x222222), r=l.clone();
 l.position.set(-.18,.45,0); r.position.set(.18,.45,0); g.add(l,r);
 g.position.set(x,0,z); scene.add(g); people.push(g);
}
function car(x,z){
 const g=new THREE.Group();
 const base=box(2.2,.65,4,0x20252a); base.position.y=.55; g.add(base);
 const top=box(1.65,.55,2,0x65c5e8); top.position.y=1.05; g.add(top);
 g.position.set(x,.0,z); scene.add(g); cars.push(g);
}
function dog(x,z){
 const g=new THREE.Group();
 const b=box(.75,.55,1.1,0x9b693e); b.position.y=.55; g.add(b);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.38,10,8),new THREE.MeshStandardMaterial({color:0xb07b4b}));
 h.position.set(0,.75,-.65); g.add(h);
 g.position.set(x,0,z); scene.add(g); animals.push(g);
}

/* ciudad */
const ground=box(260,.2,260,0x69a953); ground.position.y=-.1; ground.receiveShadow=true; scene.add(ground);
road(0,0,14,260); road(0,0,260,14);
for(let x=-110;x<=110;x+=22) for(let z=-110;z<=110;z+=22){
 if(Math.abs(x)<14||Math.abs(z)<14) continue;
 house(x,z);
}
for(let i=0;i<150;i++){
 let x=(Math.random()*240)-120, z=(Math.random()*240)-120;
 if(Math.abs(x)<12||Math.abs(z)<12) continue;
 tree(x,z,.65+Math.random()*.6);
}
for(let i=0;i<80;i++) person((Math.random()*220)-110,(Math.random()*220)-110);
for(let i=0;i<14;i++) car((Math.random()*200)-100,(Math.random()*200)-100);
for(let i=0;i<25;i++) dog((Math.random()*220)-110,(Math.random()*220)-110);

/* jugador */
const player=new THREE.Group();
const pb=box(.72,1.35,.5,0x174ea6); pb.position.y=1.35; player.add(pb);
const ph=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),new THREE.MeshStandardMaterial({color:0xffc9a6}));
ph.position.y=2.35; player.add(ph);
const leg1=box(.2,.95,.2,0x222222),leg2=leg1.clone();
leg1.position.set(-.2,.45,0);leg2.position.set(.2,.45,0);player.add(leg1,leg2);
player.position.set(0,0,20);
scene.add(player);

let camAngle=0;
let camDistance=7;
let targetCam=new THREE.Vector3();

function move(){
 const speed=(running?0.16:0.085);
 const f=new THREE.Vector3(Math.sin(camAngle),0,Math.cos(camAngle));
 const right=new THREE.Vector3(Math.cos(camAngle),0,-Math.sin(camAngle));
 const dir=new THREE.Vector3();
 dir.addScaledVector(f,-joyY).addScaledVector(right,joyX);
 if(dir.lengthSq()>.01){
   dir.normalize();
   player.position.addScaledVector(dir,speed);
   player.rotation.y=Math.atan2(dir.x,dir.z);
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-125,125);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-125,125);
}

function updateCamera(){
 targetCam.set(
   player.position.x-Math.sin(camAngle)*camDistance,
   player.position.y+4.2,
   player.position.z-Math.cos(camAngle)*camDistance
 );
 camera.position.lerp(targetCam,.12);
 const look=new THREE.Vector3(player.position.x,player.position.y+1.5,player.position.z);
 camera.lookAt(look);
}

let dragging=false,lastX=0;
renderer.domElement.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX});
renderer.domElement.addEventListener("pointermove",e=>{
 if(dragging){camAngle-=(e.clientX-lastX)*.006;lastX=e.clientX}
});
renderer.domElement.addEventListener("pointerup",()=>dragging=false);

const joy=document.getElementById("joy"),stick=document.getElementById("stick");
function setJoy(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,max=48,d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 joyX=dx/max;joyY=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetJoy(){joyX=joyY=0;stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerdown",e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});
joy.addEventListener("pointermove",e=>setJoy(e));
joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);
document.getElementById("run").addEventListener("pointerdown",()=>running=true);
document.getElementById("run").addEventListener("pointerup",()=>running=false);
document.getElementById("run").addEventListener("pointercancel",()=>running=false);

document.getElementById("help").onclick=()=>show("ð® Joystick izquierdo: caminar. ð MantÃ©n presionado para correr. Arrastra sobre la pantalla para girar la cÃ¡mara.");

function show(t){
 const m=document.getElementById("msg");m.textContent=t;m.style.display="block";
 setTimeout(()=>m.style.display="none",3000);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=clock.getDelta();
 day+=dt;
 move();

 people.forEach((p,i)=>{
   const t=day*.25+i;
   p.position.x+=Math.sin(t)*.004;
   p.position.z+=Math.cos(t)*.004;
 });
 cars.forEach((c,i)=>{
   c.position.x+=((i%2)?1:-1)*dt*1.4;
   if(c.position.x>130)c.position.x=-130;
   if(c.position.x<-130)c.position.x=130;
 });
 animals.forEach((a,i)=>{
   a.rotation.y+=Math.sin(day+i)*.001;
 });
 updateCamera();
 renderer.render(scene,camera);
}
animate();

document.getElementById("people").textContent=people.length;
document.getElementById("houses").textContent=document.querySelectorAll("body").length?Math.floor(221/1):0;
document.getElementById("cars").textContent=cars.length;
document.getElementById("animals").textContent=animals.length;

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
