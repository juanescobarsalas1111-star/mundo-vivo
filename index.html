<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mundo Vivo</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#101820}
canvas{display:block;width:100%;height:100%;touch-action:none}

#panel{
position:fixed;top:10px;left:10px;right:10px;
background:rgba(10,20,25,.78);color:white;
padding:10px;border-radius:15px;z-index:5;
backdrop-filter:blur(8px);font-size:13px
}

#panel b{color:#7fffd4}

#acciones{
position:fixed;bottom:15px;left:50%;
transform:translateX(-50%);
display:flex;gap:7px;flex-wrap:wrap;
justify-content:center;width:96%;z-index:6
}

button{
border:0;border-radius:13px;padding:11px 13px;
font-weight:bold;background:#fff;color:#123;
box-shadow:0 3px 10px #0006
}

button:active{transform:scale(.94)}

#mensaje{
position:fixed;bottom:105px;left:50%;
transform:translateX(-50%);
background:#000b;color:white;padding:10px 18px;
border-radius:20px;display:none;z-index:10;
text-align:center
}

#estado{
position:fixed;top:105px;left:10px;
background:#0009;color:white;padding:9px;
border-radius:12px;z-index:5;
line-height:1.6
}
</style>
</head>

<body>

<canvas id="mundo"></canvas>

<div id="panel">
<b>🌎 MUNDO VIVO</b><br>
👥 Habitantes: <span id="poblacion">100</span>
&nbsp; 🏠 Casas: <span id="casas">0</span>
&nbsp; 🚗 Autos: <span id="autos">0</span>
&nbsp; 🐕 Animales: <span id="animales">0</span><br>
🌦️ Clima: <span id="clima">Soleado</span>
&nbsp; 💰 Economía: <span id="economia">Estable</span>
&nbsp; ❤️ Mundo: <span id="saludMundo">100%</span>
</div>

<div id="estado">
👤 <b>TÚ</b><br>
❤️ Salud: <span id="salud">100</span>%<br>
🍎 Comida: <span id="comida">10</span><br>
💧 Agua: <span id="agua">10</span><br>
🩺 Botiquines: <span id="botiquines">5</span>
</div>

<div id="mensaje"></div>

<div id="acciones">
<button onclick="clima('☀️ Soleado')">☀️</button>
<button onclick="clima('🌧️ Lluvia')">🌧️</button>
<button onclick="clima('⛈️ Tormenta')">⛈️</button>
<button onclick="clima('🌙 Noche')">🌙</button>
<button onclick="sanar()">🩺 Sanar</button>
<button onclick="comidaAyuda()">🍎 Ayudar</button>
<button onclick="rescate()">🚑 Rescate</button>
<button onclick="dios()">✨ Dios</button>
</div>

<script>

const canvas=document.getElementById("mundo");
const ctx=canvas.getContext("2d");

let W,H;
let climaActual="☀️ Soleado";
let presencia=false;

const jugador={
 x:500,y:400,
 salud:100,
 comida:10,
 agua:10,
 botiquines:5,
 objetivo:null
};

let personas=[];
let casas=[];
let autos=[];
let animales=[];
let arboles=[];
let nubes=[];
let lluvia=[];

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

function rand(a,b){
 return Math.random()*(b-a)+a;
}

function crearMundo(){

 personas=[];
 casas=[];
 autos=[];
 animales=[];
 arboles=[];
 nubes=[];
 lluvia=[];

 for(let i=0;i<100;i++){
  personas.push({
   x:rand(80,W-80),
   y:rand(180,H-120),
   salud:rand(60,100),
   hambre:rand(0,100),
   sed:rand(0,100),
   nombre:["Juan","María","Pedro","Ana","Luis","Sofía"][Math.floor(rand(0,6))],
   trabajo:["Agricultor","Doctor","Maestro","Comerciante","Mecánico","Constructor"][Math.floor(rand(0,6))],
   vx:rand(-.4,.4),
   vy:rand(-.4,.4)
  });
 }

 for(let i=0;i<22;i++)
  casas.push({x:rand(60,W-100),y:rand(250,H-130),s:rand(.8,1.3)});

 for(let i=0;i<12;i++)
  autos.push({x:rand(50,W-70),y:rand(220,H-100),a:Math.random()>.5});

 for(let i=0;i<18;i++)
  animales.push({
   x:rand(40,W-40),
   y:rand(220,H-80),
   tipo:Math.random()>.5?"🐕":"🐄"
  });

 for(let i=0;i<80;i++)
  arboles.push({x:rand(0,W),y:rand(180,H),s:rand(.6,1.3)});

 for(let i=0;i<12;i++)
  nubes.push({x:rand(0,W),y:rand(60,170),s:rand(.7,1.5)});

 for(let i=0;i<250;i++)
  lluvia.push({x:rand(0,W),y:rand(0,H),v:rand(5,10)});

}

crearMundo();

function dibujarCielo(){

 let g=ctx.createLinearGradient(0,0,0,H);

 if(climaActual==="🌙 Noche"){
  g.addColorStop(0,"#07142e");
  g.addColorStop(1,"#182d4d");
 }else{
  g.addColorStop(0,"#65c9ff");
  g.addColorStop(1,"#d7f5ff");
 }

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 if(climaActual==="🌙 Noche"){
  ctx.fillStyle="#fff";
  for(let i=0;i<70;i++){
   let x=(i*137)%W;
   let y=30+(i*67)%180;
   ctx.fillRect(x,y,2,2);
  }
 }else{
  ctx.fillStyle="#ffe27a";
  ctx.beginPath();
  ctx.arc(W-80,75,38,0,Math.PI*2);
  ctx.fill();
 }
}

function dibujarTerreno(){

 ctx.fillStyle="#73b85a";
 ctx.fillRect(0,H*.38,W,H);

 ctx.fillStyle="#5ca9d6";
 ctx.fillRect(0,H*.38,W,65);

 ctx.fillStyle="#555";
 ctx.fillRect(0,H*.61,W,75);

 ctx.fillStyle="#ddd";
 for(let x=0;x<W;x+=70)
  ctx.fillRect(x,H*.645,40,6);

 ctx.fillStyle="#777";
 ctx.fillRect(W*.47,H*.38,80,H*.23);

 ctx.fillStyle="#eee";
 for(let y=H*.4;y<H*.61;y+=40)
  ctx.fillRect(W*.51,y,8,22);
}

function dibujarCasas(){

 casas.forEach(c=>{
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.scale(c.s,c.s);

  ctx.fillStyle="#ead5ad";
  ctx.fillRect(0,20,65,50);

  ctx.fillStyle="#8b3f2f";
  ctx.beginPath();
  ctx.moveTo(-8,20);
  ctx.lineTo(32,-15);
  ctx.lineTo(73,20);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#77b7d8";
  ctx.fillRect(12,35,15,15);
  ctx.fillRect(42,35,15,15);

  ctx.fillStyle="#5b3926";
  ctx.fillRect(27,48,14,22);

  ctx.restore();
 });
}

function dibujarArboles(){

 arboles.forEach(t=>{
  ctx.fillStyle="#70452d";
  ctx.fillRect(t.x-4,t.y,8,25*t.s);

  ctx.fillStyle="#267a35";
  ctx.beginPath();
  ctx.arc(t.x,t.y,18*t.s,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#3d963f";
  ctx.beginPath();
  ctx.arc(t.x-10,t.y+4,12*t.s,0,Math.PI*2);
  ctx.fill();
 });
}

function dibujarNubes(){

 nubes.forEach(n=>{
  n.x+=.15;
  if(n.x>W+100)n.x=-100;

  ctx.fillStyle=climaActual==="🌙 Noche"?"#253b55":"#fff";

  ctx.beginPath();
  ctx.arc(n.x,n.y,20*n.s,0,Math.PI*2);
  ctx.arc(n.x+25*n.s,n.y-10*n.s,27*n.s,0,Math.PI*2);
  ctx.arc(n.x+55*n.s,n.y,20*n.s,0,Math.PI*2);
  ctx.fill();
 });
}

function dibujarAutos(){

 autos.forEach(a=>{
  a.x+=a.a?.5:-.5;

  if(a.x>W+50)a.x=-50;
  if(a.x<-50)a.x=W+50;

  ctx.fillStyle="#222";
  ctx.fillRect(a.x,a.y,38,17);

  ctx.fillStyle="#7fd0ef";
  ctx.fillRect(a.x+7,a.y-7,22,9);

  ctx.fillStyle="#111";
  ctx.beginPath();
  ctx.arc(a.x+8,a.y+17,5,0,Math.PI*2);
  ctx.arc(a.x+30,a.y+17,5,0,Math.PI*2);
  ctx.fill();
 });
}

function dibujarAnimales(){

 animales.forEach(a=>{
  a.x+=Math.sin(Date.now()/1000+a.y)*.15;

  ctx.font="25px Arial";
  ctx.fillText(a.tipo,a.x,a.y);
 });
}

function dibujarPersonas(){

 personas.forEach(p=>{

  p.x+=p.vx;
  p.y+=p.vy;

  if(p.x<20||p.x>W-20)p.vx*=-1;
  if(p.y<H*.40||p.y>H-40)p.vy*=-1;

  p.hambre+=.008;
  p.sed+=.01;

  if(p.hambre>80||p.sed>80)p.salud-=.01;

  p.salud=Math.max(1,Math.min(100,p.salud));

  ctx.fillStyle=p.salud<40?"#d33":"#f2c29b";
  ctx.beginPath();
  ctx.arc(p.x,p.y-15,8,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=p.salud<40?"#922":"#2366a8";
  ctx.fillRect(p.x-7,p.y-7,14,20);

  ctx.fillStyle="#222";
  ctx.fillRect(p.x-7,p.y+13,5,12);
  ctx.fillRect(p.x+2,p.y+13,5,12);

  if(p.salud<50){
   ctx.fillStyle="#fff";
   ctx.font="10px Arial";
   ctx.fillText(Math.round(p.salud)+"%",p.x-12,p.y-27);
  }
 });
}

function dibujarJugador(){

 ctx.save();
 ctx.translate(jugador.x,jugador.y);

 ctx.fillStyle="#ffd0aa";
 ctx.beginPath();
 ctx.arc(0,-22,10,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#174ea6";
 ctx.fillRect(-10,-12,20,27);

 ctx.fillStyle="#222";
 ctx.fillRect(-9,15,7,15);
 ctx.fillRect(2,15,7,15);

 ctx.fillStyle="#fff";
 ctx.font="bold 13px Arial";
 ctx.fillText("TÚ",-11,-38);

 ctx.restore();
}

function dibujarDios(){

 if(!presencia)return;

 let x=W/2,y=H*.2;

 let g=ctx.createRadialGradient(x,y,5,x,y,150);
 g.addColorStop(0,"rgba(255,255,255,.9)");
 g.addColorStop(1,"rgba(255,255,255,0)");

 ctx.fillStyle=g;
 ctx.fillRect(x-150,y-150,300,300);

 ctx.strokeStyle="white";
 ctx.lineWidth=8;

 ctx.beginPath();
 ctx.moveTo(x,y-45);
 ctx.lineTo(x,y+45);
 ctx.moveTo(x-30,y-10);
 ctx.lineTo(x+30,y-10);
 ctx.stroke();

 ctx.fillStyle="#fff";
 ctx.font="bold 15px Arial";
 ctx.textAlign="center";
 ctx.fillText("PRESENCIA DIVINA",x,y+75);
 ctx.textAlign="left";
}

function dibujarLluvia(){

 if(climaActual==="🌧️ Lluvia"||climaActual==="⛈️ Tormenta"){

  ctx.strokeStyle="rgba(190,220,255,.65)";
  ctx.lineWidth=1;

  lluvia.forEach(r=>{
   ctx.beginPath();
   ctx.moveTo(r.x,r.y);
   ctx.lineTo(r.x-3,r.y+12);
   ctx.stroke();

   r.y+=r.v;

   if(r.y>H){
    r.y=-20;
    r.x=rand(0,W);
   }
  });
 }

 if(climaActual==="⛈️ Tormenta"&&Math.random()<.008){
  ctx.fillStyle="rgba(255,255,255,.7)";
  ctx.fillRect(0,0,W,H);
 }
}

function dibujar(){

 dibujarCielo();
 dibujarTerreno();
 dibujarNubes();
 dibujarArboles();
 dibujarCasas();
 dibujarAutos();
 dibujarAnimales();
 dibujarPersonas();
 dibujarJugador();
 dibujarDios();
 dibujarLluvia();

 requestAnimationFrame(dibujar);
}

dibujar();

canvas.addEventListener("pointerdown",e=>{
 jugador.objetivo={x:e.clientX,y:e.clientY};
});

function moverJugador(){

 if(!jugador.objetivo)return;

 let dx=jugador.objetivo.x-jugador.x;
 let dy=jugador.objetivo.y-jugador.y;
 let d=Math.hypot(dx,dy);

 if(d<5){
  jugador.objetivo=null;
  return;
 }

 jugador.x+=dx/d*2.5;
 jugador.y+=dy/d*2.5;
}

setInterval(moverJugador,30);

function cercano(){

 let mejor=null;
 let distancia=Infinity;

 personas.forEach(p=>{
  let d=Math.hypot(p.x-jugador.x,p.y-jugador.y);
  if(d<distancia){
   distancia=d;
   mejor=p;
  }
 });

 return {persona:mejor,distancia};
}

function mostrar(t){

 let m=document.getElementById("mensaje");
 m.textContent=t;
 m.style.display="block";

 setTimeout(()=>{
  m.style.display="none";
 },2200);
}

function sanar(){

 if(jugador.botiquines<=0){
  mostrar("❌ No tienes botiquines");
  return;
 }

 let r=cercano();

 if(r.distancia>120){
  mostrar("Acércate a una persona");
  return;
 }

 r.persona.salud=Math.min(100,r.persona.salud+35);
 jugador.botiquines--;

 mostrar("🩺 Has sanado a "+r.persona.nombre);
}

function comidaAyuda(){

 if(jugador.comida<=0){
  mostrar("❌ No tienes comida");
  return;
 }

 let r=cercano();

 if(r.distancia>120){
  mostrar("Acércate a una persona");
  return;
 }

 r.persona.hambre=Math.max(0,r.persona.hambre-60);
 r.persona.salud=Math.min(100,r.persona.salud+8);
 jugador.comida--;

 mostrar("🍎 Ayudaste a "+r.persona.nombre);
}

function rescate(){

 let r=cercano();

 if(r.distancia>150){
  mostrar("🚑 Acércate a alguien que necesite ayuda");
  return;
 }

 r.persona.salud=Math.min(100,r.persona.salud+50);
 r.persona.hambre=20;
 r.persona.sed=20;

 mostrar("🚑 Rescate realizado con éxito");
}

function clima(c){

 climaActual=c;
 document.getElementById("clima").textContent=c;
 mostrar("Clima cambiado a "+c);
}

function dios(){

 presencia=!presencia;

 mostrar(
  presencia?
  "✨ La presencia divina está en el mundo":
  "La presencia divina se ha ocultado"
 );
}

function actualizar(){

 document.getElementById("poblacion").textContent=personas.length;
 document.getElementById("casas").textContent=casas.length;
 document.getElementById("autos").textContent=autos.length;
 document.getElementById("animales").textContent=animales.length;

 document.getElementById("salud").textContent=Math.round(jugador.salud);
 document.getElementById("comida").textContent=jugador.comida;
 document.getElementById("agua").textContent=jugador.agua;
 document.getElementById("botiquines").textContent=jugador.botiquines;

 let promedio=personas.reduce((a,p)=>a+p.salud,0)/personas.length;

 document.getElementById("saludMundo").textContent=Math.round(promedio)+"%";

 document.getElementById("economia").textContent=
 promedio>75?"Fuerte":
 promedio>50?"Estable":
 "En crisis";
}

setInterval(actualizar,500);

</script>

</body>
</html>
