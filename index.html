<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mundo Vivo 3D V10</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071018;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  touch-action:none
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white
}

#topbar{
  position:absolute;
  top:max(10px,env(safe-area-inset-top));
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start
}

.card{
  background:rgba(8,15,22,.72);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  padding:9px 12px;
  box-shadow:0 5px 20px #0004
}

#title{
  font-weight:900;
  font-size:16px
}

#stats{
  font-size:11px;
  opacity:.85;
  margin-top:2px
}

#settingsBtn{
  pointer-events:auto;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.9);
  color:#111;
  font-size:22px;
  width:46px;
  height:46px
}

#hint{
  position:absolute;
  top:74px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  padding:7px 11px;
  opacity:.7;
  white-space:nowrap
}

#joystick{
  position:absolute;
  left:20px;
  bottom:max(24px,env(safe-area-inset-bottom));
  width:clamp(110px,28vw,150px);
  height:clamp(110px,28vw,150px);
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.14);
  pointer-events:auto
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:42%;
  height:42%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(255,255,255,.28);
  border:2px solid rgba(255,255,255,.35)
}

#actions{
  position:absolute;
  right:18px;
  bottom:max(25px,env(safe-area-inset-bottom));
  display:flex;
  gap:10px;
  align-items:end;
  pointer-events:auto
}

.action{
  width:clamp(55px,15vw,78px);
  height:clamp(55px,15vw,78px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  background:rgba(255,255,255,.13);
  color:white;
  font-weight:800;
  font-size:12px;
  backdrop-filter:blur(8px)
}

.action:active{
  transform:scale(.94);
  background:rgba(255,255,255,.25)
}

#lookZone{
  position:absolute;
  right:0;
  top:0;
  width:62%;
  height:72%;
  pointer-events:auto
}

#settings{
  position:fixed;
  z-index:10;
  right:12px;
  top:65px;
  width:min(310px,calc(100vw - 24px));
  display:none;
  background:rgba(8,15,22,.94);
  color:white;
  border:1px solid #ffffff20;
  border-radius:18px;
  padding:15px;
  backdrop-filter:blur(16px);
  box-shadow:0 15px 50px #0008
}

#settings.open{
  display:block
}

.panelTitle{
  font-weight:900;
  font-size:17px;
  margin-bottom:12px
}

.row{
  margin:12px 0
}

.row label{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  opacity:.9;
  margin-bottom:6px
}

input[type=range]{
  width:100%
}

select{
  width:100%;
  padding:9px;
  border-radius:10px;
  background:#18232c;
  color:white;
  border:1px solid #ffffff22
}

.small{
  font-size:11px;
  opacity:.62;
  line-height:1.4
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:7px;
  height:7px;
  margin:-3px;
  border:1px solid #fff;
  border-radius:50%;
  opacity:.55
}

@media(min-width:900px){
  #lookZone{
    width:55%
  }

  #hint{
    font-size:12px
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="topbar">

    <div class="card">

      <div id="title">
        🌎 MUNDO VIVO <span style="opacity:.55">V10</span>
      </div>

      <div id="stats">
        Exploración • 360° • Día
      </div>

    </div>

    <button id="settingsBtn">
      ⚙️
    </button>

  </div>

  <div id="hint" class="card">
    Arrastra la pantalla para mirar • Joystick para caminar
  </div>

  <div id="crosshair"></div>

  <div id="lookZone"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="actions">

    <button class="action" id="jump">
      SALTAR
    </button>

    <button class="action" id="run">
      CORRER
    </button>

  </div>

</div>

<div id="settings">

  <div class="panelTitle">
    ⚙️ Configuración
  </div>

  <div class="row">

    <label>
      Tamaño de controles
      <b id="sizeVal">100%</b>
    </label>

    <input
      id="size"
      type="range"
      min="70"
      max="140"
      value="100"
    >

  </div>

  <div class="row">

    <label>
      Sensibilidad cámara
      <b id="sensVal">100%</b>
    </label>

    <input
      id="sens"
      type="range"
      min="40"
      max="180"
      value="100"
    >

  </div>

  <div class="row">

    <label>
      Calidad
    </label>

    <select id="quality">

      <option value="1">
        Alta
      </option>

      <option value=".8">
        Media
      </option>

      <option value=".6">
        Ahorro
      </option>

    </select>

  </div>

  <div class="row">

    <label>
      Hora del mundo
      <b id="timeVal">12:00</b>
    </label>

    <input
      id="time"
      type="range"
      min="0"
      max="24"
      value="12"
      step=".25"
    >

  </div>

  <div class="small">

    V10 incluye cámara libre 360°, personaje humanoide,
    animales, árboles, agua, ciclo día/noche y controles táctiles.

  </div>

</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


/* =========================
   MOTOR
========================= */

const canvas =
document.getElementById('game');

const renderer =
new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  powerPreference:'high-performance'
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.8)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.05;


/* =========================
   ESCENA
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x8fc9ed);

scene.fog =
new THREE.Fog(
  0x8fc9ed,
  55,
  240
);


/* =========================
   CAMARA
========================= */

const camera =
new THREE.PerspectiveCamera(
  68,
  innerWidth/innerHeight,
  .05,
  500
);

camera.position.set(
  0,
  3,
  7
);


/* =========================
   LUCES
========================= */

const hemi =
new THREE.HemisphereLight(
  0xbfe8ff,
  0x47613a,
  1.8
);

scene.add(hemi);

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2.8
);

sun.position.set(
  40,
  80,
  30
);

sun.castShadow=true;

sun.shadow.mapSize.set(
  2048,
  2048
);

sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;

scene.add(sun);


/* =========================
   MUNDO
========================= */

const world =
new THREE.Group();

scene.add(world);


function mat(
  color,
  rough=.85
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough
  });

}


const grass =
mat(0x3c8c45);

const dirt =
mat(0x80603e);

const water =
mat(0x2d9ed0,.25);

const trunk =
mat(0x70432a);

const leaf =
mat(0x2e8d3f);

const skin =
mat(0xd49a72);

const shirt =
mat(0x2f65c8);

const pants =
mat(0x26384d);

const hair =
mat(0x2b1b14);

const dark =
mat(0x171a1d);


/* =========================
   TERRENO
========================= */

const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    360,
    360
  ),
  grass
);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

world.add(ground);


/* =========================
   CAMINO
========================= */

const path =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    16,
    360
  ),
  dirt
);

path.rotation.x=
-Math.PI/2;

path.position.y=.012;

world.add(path);


/* =========================
   LAGO
========================= */

const lake =
new THREE.Mesh(
  new THREE.CircleGeometry(
    34,
    64
  ),
  water
);

lake.rotation.x=
-Math.PI/2;

lake.position.set(
  72,
  .03,
  -40
);

world.add(lake);


/* =========================
   ARBOLES
========================= */

function tree(
  x,
  z,
  s=1
){

  const g =
  new THREE.Group();


  const t =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .28*s,
      .42*s,
      3*s,
      8
    ),
    trunk
  );

  t.position.y=
  1.5*s;

  t.castShadow=true;

  g.add(t);


  const a =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1.5*s,
      10,
      8
    ),
    leaf
  );

  a.position.y=
  3.5*s;

  a.castShadow=true;

  g.add(a);


  g.position.set(
    x,
    0,
    z
  );

  world.add(g);

}


for(
  let i=0;
  i<95;
  i++
){

  const x =
  (Math.random()-.5)*300;

  const z =
  (Math.random()-.5)*300;

  if(
    Math.abs(x)<15
  ){
    continue;
  }

  tree(
    x,
    z,
    .65+Math.random()*.7
  );

}


/* =========================
   PERSONAJES HUMANOS
========================= */

function humanoid(
  x,
  z,
  scale=1,
  color=0x2f65c8
){

  const g =
  new THREE.Group();


  const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .48*scale,
      .9*scale,
      6,
      10
    ),
    mat(color)
  );

  body.position.y=
  1.55*scale;

  body.castShadow=true;

  g.add(body);


  const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .38*scale,
      16,
      12
    ),
    skin
  );

  head.position.y=
  2.45*scale;

  head.castShadow=true;

  g.add(head);


  const h =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .4*scale,
      16,
      8
    ),
    hair
  );

  h.scale.y=.55;

  h.position.y=
  2.72*scale;

  h.castShadow=true;

  g.add(h);


  for(
    const sx of [-.22,.22]
  ){

    const leg =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .14*scale,
        .7*scale,
        5,
        8
      ),
      pants
    );

    leg.position.set(
      sx*scale,
      .65*scale,
      0
    );

    leg.castShadow=true;

    g.add(leg);

  }


  for(
    const sx of [-.68,.68]
  ){

    const arm =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .13*scale,
        .7*scale,
        5,
        8
      ),
      mat(color)
    );

    arm.position.set(
      sx*scale,
      1.62*scale,
      0
    );

    arm.rotation.z =
    sx<0 ? .18 : -.18;

    arm.castShadow=true;

    g.add(arm);

  }


  for(
    const sx of [-.14,.14]
  ){

    const eye =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .035*scale,
        8,
        6
      ),
      dark
    );

    eye.position.set(
      sx*scale,
      2.49*scale,
      .36*scale
    );

    g.add(eye);

  }


  g.position.set(
    x,
    0,
    z
  );

  world.add(g);

  return g;

}


const people=[

  humanoid(
    4,
    -8,
    1,
    0x2f65c8
  ),

  humanoid(
    -5,
    -13,
    1,
    0x9c3a36
  ),

  humanoid(
    9,
    -20,
    1.05,
    0x3f8650
  ),

  humanoid(
    -10,
    -25,
    .95,
    0x8c5aa8
  )

];


/* =========================
   ANIMALES
========================= */

function animal(
  x,
  z
){

  const g =
  new THREE.Group();

  const brown =
  mat(0x8b5a35);


  const b =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .7,
      12,
      8
    ),
    brown
  );

  b.scale.set(
    1.4,
    .8,
    2
  );

  b.position.y=.75;

  g.add(b);


  const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .42,
      12,
      8
    ),
    brown
  );

  head.position.set(
    0,
    1.05,
    1.25
  );

  g.add(head);


  for(
    const sx of [-.42,.42]
  ){

    for(
      const sz of [-.55,.55]
    ){

      const l =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .09,
          .12,
          .7,
          8
        ),
        brown
      );

      l.position.set(
        sx,
        .35,
        sz
      );

      g.add(l);

    }

  }


  g.position.set(
    x,
    0,
    z
  );

  world.add(g);

}


for(
  let i=0;
  i<14;
  i++
){

  animal(
    (Math.random()-.5)*130,
    (Math.random()-.5)*130
  );

}


/* =========================
   JUGADOR
========================= */

const player =
new THREE.Group();

world.add(player);


const pbody =
new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .42,
    .85,
    6,
    10
  ),
  shirt
);

pbody.position.y=
1.45;

pbody.castShadow=true;

player.add(pbody);


const phead =
new THREE.Mesh(
  new
