<!DOCTYPE html>
<html lang="es">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd0e8;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:10px;right:10px;z-index:10;pointer-events:none}
#hudbox{display:inline-block;max-width:calc(100% - 20px);padding:10px 14px;border-radius:16px;background:rgba(7,16,25,.72);backdrop-filter:blur(8px);color:white;box-shadow:0 8px 25px #0004}
#title{font-size:18px;font-weight:900;color:#7fffe0;margin-bottom:4px}
#stats{font-size:12px;line-height:1.5}
#mini{position:fixed;top:12px;right:12px;z-index:20;display:flex;gap:6px}
button,select,input{font:inherit}
.btn{border:0;border-radius:13px;padding:10px 13px;background:#fff;color:#17202b;font-weight:800;box-shadow:0 5px 14px #0003}
.btn:active{transform:scale(.96)}
#settingsBtn{font-size:20px;padding:9px 12px}
#panel{position:fixed;right:12px;top:58px;width:min(300px,calc(100vw - 24px));max-height:78vh;overflow:auto;z-index:30;background:rgba(7,14,23,.94);color:white;border-radius:18px;padding:14px;display:none;box-shadow:0 15px 40px #0007}
.panelTitle{font-size:18px;font-weight:900;margin-bottom:10px;color:#7fffe0}
.row{margin:9px 0}.row label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:#dce6ef}
.row input[type=range]{width:100%}.row select,.row input[type=text],.row input[type=color]{width:100%;border:0;border-radius:10px;padding:8px}
#joystick{position:fixed;left:24px;bottom:34px;width:132px;height:132px;border:3px solid #fff9;border-radius:50%;background:#ffffff18;z-index:15}
#stick{position:absolute;width:56px;height:56px;left:35px;top:35px;border-radius:50%;background:#ffffffd9;box-shadow:0 5px 16px #0004}
#cameraHint{position:fixed;right:22px;bottom:46px;width:160px;text-align:center;color:#fff9;font-size:12px;z-index:5;pointer-events:none}
#run{position:fixed;right:28px;bottom:210px;width:76px;height:76px;border-radius:50%;border:0;background:#fff;color:#18202a;font-size:22px;font-weight:900;z-index:15;box-shadow:0 8px 20px #0004}
#actions{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:16;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:min(620px,92vw)}
#actions .btn{padding:9px 11px;font-size:12px}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;background:#06101ae8;color:white;padding:14px 18px;border-radius:14px;display:none;font-weight:800;text-align:center}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff9}
#cross:before{left:8px;top:0;width:2px;height:18px}.cross:after{top:8px;left:0;width:18px;height:2px}
#customPanel{position:fixed;left:12px;top:58px;width:min(300px,calc(100vw - 24px));max-height:78vh;overflow:auto;z-index:31;background:rgba(7,14,23,.96);color:white;border-radius:18px;padding:14px;display:none;box-shadow:0 15px 40px #0007}
#weather{font-size:12px;color:#bfefff}
@media(max-width:600px){
  #hudbox{max-width:74vw}
  #title{font-size:15px}.btn{padding:9px 10px}
  #actions{bottom:10px}
}
</style>
</head>
<body>

  <div id="title">MUNDO VIVO 3D â V10</div>

</div></div>

<div id="mini"><button class="btn" id="settingsBtn">âï¸</button></div>

<div id="panel">
  <div class="panelTitle">âï¸ ConfiguraciÃ³n</div>

  <button class="btn" id="exitCar">Bajar</button>

</div>
<div id="cross"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86cde5);
scene.fog=new THREE.Fog(0x86cde5,70,230);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xbfefff,0x53613d,2.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(60,100,40);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const world=new THREE.Group();scene.add(world);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x58a957,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);

const roadMat=new THREE.MeshStandardMaterial({color:0x313841,roughness:.95});
function box(w,h,d,c,x,y,z,group=world){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}
function cyl(r,h,c,x,y,z,group=world){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}
function sphere(r,c,x,y,z,group=world){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),new THREE.MeshStandardMaterial({color:c,roughness:.75}));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}

for(let i=-120;i<=120;i+=20){
  box(8,.04,260,0x343a40,i,.02,0);
  box(260,.04,8,0x343a40,0,.021,i);
}
for(let i=-120;i<=120;i+=20){
  for(let z=-120;z<=120;z+=10) box(.18,.06,5,0xf2df69,i,.07,z);
  for(let x=-120;x<=120;x+=10) box(5,.06,.18,0xf2df69,x,.071,i);
}

function tree(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  cyl(.28,2.5,0x6c4228,0,1.25,0,g);
  sphere(1.25,0x2f7f3d,0,3,0,g);
  sphere(.9,0x3e9a4b,.75,3.35,.15,g);
  world.add(g);
}
for(let i=0;i<75;i++){let x=(Math.random()-.5)*250,z=(Math.random()-.5)*250;if(Math.abs(x%20)>5&&Math.abs(z%20)>5)tree(x,z)}

const houses=[];
function house(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  const colors=[0xd9b48c,0xc8d4d9,0xe2a48d,0xb7c8a4,0xd1c0e8];
  box(8,5,7,colors[Math.floor(Math.random()*colors.length)],0,2.5,0,g);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(5.7,2.8,4),new THREE.MeshStandardMaterial({color:0x8b3f35}));
  roof.rotation.y=Math.PI/4;roof.position.y=6.4;roof.castShadow=true;g.add(roof);
  box(1.5,2.5,0.18,0x563b29,0,.1,3.55,g);
  box(1.5,1.3,.12,0x77bde8,-2,3,3.6,g);box(1.5,1.3,.12,0x77bde8,2,3,3.6,g);
  world.add(g);houses.push(g);
}
for(let i=0;i<44;i++)house((Math.floor(Math.random()*12)-6)*20+Math.random()*5,(Math.floor(Math.random()*12)-6)*20+Math.random()*5);

function human(opts={}){
  const g=new THREE.Group();
  const skin=opts.skin||[0x6d3e28,0x9a6245,0xc98b62,0xf0c3a0][Math.floor(Math.random()*4)];
  const shirt=opts.shirt||[0x1769aa,0x9b2d30,0x2d7d46,0x8c5ac7,0xd18b25][Math.floor(Math.random()*5)];
  const pants=opts.pants||[0x243447,0x4c3326,0x56616b,0x151b24][Math.floor(Math.random()*4)];
  const hair=opts.hair||[0x1a1716,0x4b2b1c,0x8b5a2b,0x9b4a2c][Math.floor(Math.random()*4)];
  const s=opts.scale||(.9+Math.random()*.18);
  const torso=box(1.15,1.65,.65,shirt,0,1.75,0,g);
  torso.scale.x=opts.female?.9:1;
  cyl(.28,.25,skin,0,2.65,0,g);
  const head=sphere(.52,skin,0,3.35,0,g);
  const hairMesh=sphere(.55,hair,0,3.62,0,g);hairMesh.scale.y=.55;
  if(Math.random()>.25){
    sphere(.07,0x171717,-.18,3.39,.46,g);sphere(.07,0x171717,.18,3.39,.46,g);
  }
  const armL=box(.32,1.35,.34,shirt,-.82,1.82,0,g),armR=box(.32,1.35,.34,shirt,.82,1.82,0,g);
  const legL=box(.38,1.55,.4,pants,-.3,.35,0,g),legR=box(.38,1.55,.4,pants,.3,.35,0,g);
  box(.44,.18,.7,0x17191c,-.3,-.47,.08,g);box(.44,.18,.7,0x17191c,.3,-.47,.08,g);
  g.scale.setScalar(s);
  g.userData={speed:.018+Math.random()*.035,phase:Math.random()*6.28,name:opts.name||randomName(),job:opts.job||randomJob(),home:null};
  return g;
}
const names=["Ana","Carlos","Luis","MarÃ­a","SofÃ­a","Diego","Juan","Laura","Miguel","Elena","Pedro","Daniela","JosÃ©","Valeria","Marco","Fernanda","Ricardo","Gabriela"];
const jobs=["Comerciante","MecÃ¡nico","Maestra","Doctor","AlbaÃ±il","Chef","PolicÃ­a","Conductor","Agricultor","Ingeniera"];
function randomName(){return names[Math.floor(Math.random()*names.length)]}
function randomJob(){return jobs[Math.floor(Math.random()*jobs.length)]}

const people=[];
for(let i=0;i<62;i++){
  const p=human();
  p.position.set((Math.random()-.5)*220,0,(Math.random()-.5)*220);
  p.userData.target=new THREE.Vector3((Math.random()-.5)*220,0,(Math.random()-.5)*220);
  world.add(p);people.push(p);
}

function carMesh(color){
  const g=new THREE.Group();
  box(2.2,.65,4.1,color,0,.85,0,g);
  box(1.7,.65,2,0x6e8290,0,1.25,-.05,g);
  for(const x of [-1.15,1.15])for(const z of [-1.35,1.35])cyl(.38,.22,0x14171a,x,.45,z,g).rotation.x=Math.PI/2;
  g.userData={speed:.035+Math.random()*.045,dir:Math.random()<.5?1:-1};
  return g;
}
const cars=[];
for(let i=0;i<16;i++){
  const c=carMesh([0xb72d2d,0x1c5aa6,0xd8d8d8,0x252525,0xe0a21a][i%5]);
  c.position.set((Math.random()-.5)*230,.0,(Math.floor(Math.random()*12)-6)*20);
  c.rotation.y=Math.random()<.5?0:Math.PI;
  world.add(c);cars.push(c);
}

function animal(x,z,type="dog"){
  const g=new THREE.Group();g.position.set(x,0,z);
  const col=type==="cow"?0x7a5a45:type==="horse"?0x6c4328:0xd0a16e;
  box(type==="cow"?1.7:1.2,.75,type==="cow"?2.2:1.6,col,0,.65,0,g);
  sphere(.4,col,0,1.15,type==="cow"?1.0:.8,g);
  for(const x of [-.5,.5])for(const z of [-.55,.55])box(.18,.65,.18,col,x,.25,z,g);
  g.userData={speed:.01+Math.random()*.018,phase:Math.random()*6.28};
  world.add(g);return g;
}
const animals=[];for(let i=0;i<28;i++)animals.push(animal((Math.random()-.5)*230,(Math.random()-.5)*230,i%7===0?"cow":i%5===0?"horse":"dog"));

let player=human({name:"Juan",skin:0xc98b62,hair:0x24180f,shirt:0x1769aa,pants:0x26384a,scale:1});
player.userData.isPlayer=true;
player.position.set(0,0,0);world.add(player);

const camTarget=new THREE.Vector3();
let yaw=0,pitch=.18,camDist=7,camSens=1,run=false,inCar=null,night=false,hudVisible=true;
let moveX=0,moveY=0,dragging=false,lastX=0,lastY=0;

function updateCamera(){
  const target=player.position.clone();target.y+=2.1;
  const x=Math.sin(yaw)*Math.cos(pitch)*camDist;
  const y=Math.sin(pitch)*camDist+1.4;
  const z=Math.cos(yaw)*Math.cos(pitch)*camDist;
  camera.position.lerp(new THREE.Vector3(target.x+x,target.y+y,target.z+z),.18);
  camera.lookAt(target);
}
function movePlayer(){
  if(inCar)return;
  const len=Math.hypot(moveX,moveY);if(len<.05)return;
  const speed=(run?.16:.085);
  const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const dir=f.multiplyScalar(moveY).add(r.multiplyScalar(moveX)).normalize();
  player.position.addScaledVector(dir,speed);
  player.rotation.y=Math.atan2(dir.x,dir.z);
}
function nearest(arr,max=8){
  let best=null,d=max;
  for(const o of arr){const dd=player.position.distanceTo(o.position);if(dd<d){d=dd;best=o}}
  return best;
}
function showMsg(t){const m=document.getElementById("msg");m.textContent=t;m.style.display="block";clearTimeout(showMsg.t);showMsg.t=setTimeout(()=>m.style.display="none",1800)}

document.getElementById("heal").onclick=()=>showMsg("â¤ï¸ Ayudaste a una persona cercana.");
document.getElementById("food").onclick=()=>showMsg("ð Entregaste comida a un habitante.");
document.getElementById("car").onclick=()=>{
  if(inCar)return showMsg("Ya estÃ¡s dentro de un auto.");
  const c=nearest(cars,6);if(!c)return showMsg("AcÃ©rcate a un auto.");
  inCar=c;showMsg("ð Subiste al auto.");
};
document.getElementById("exitCar").onclick=()=>{if(inCar){inCar=null;showMsg("Bajaste del auto.")}};
document.getElementById("run").onpointerdown=()=>run=true;document.getElementById("run").onpointerup=()=>run=false;document.getElementById("run").onpointercancel=()=>run=false;
document.getElementById("day").onclick=()=>{
  night=!night;
  scene.background.set(night?0x071321:0x86cde5);scene.fog.color.set(night?0x071321:0x86cde5);
  sun.intensity=night?.45:2.2;hemi.intensity=night?.45:2;
  showMsg(night?"ð Noche":"âï¸ DÃ­a");
};

const joy=document.getElementById("joystick"),stick=document.getElementById("stick");
function joyMove(e){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let x=e.clientX-cx,y=e.clientY-cy;const max=42,d=Math.hypot(x,y);
  if(d>max){x=x/d*max;y=y/d*max}
  stick.style.transform=`translate(${x}px,${y}px)`;moveX=x/max;moveY=-y/max;
}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);joyMove(e)};
joy.onpointermove=e=>{if(e.buttons)joyMove(e)};
joy.onpointerup=joy.onpointercancel=()=>{moveX=0;moveY=0;stick.style.transform=""};

renderer.domElement.addEventListener("pointerdown",e=>{if(e.clientX>innerWidth*.38){dragging=true;lastX=e.clientX;lastY=e.clientY}});
renderer.domElement.addEventListener("pointermove",e=>{
  if(!dragging)return;
  yaw-=(e.clientX-lastX)*.006*camSens;pitch-=(e.clientY-lastY)*.004*camSens;pitch=Math.max(-.65,Math.min(.9,pitch));
  lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener("pointerup",()=>dragging=false);

document.getElementById("settingsBtn").onclick=()=>document.getElementById("panel").style.display="block";
document.getElementById("closeSettings").onclick=()=>document.getElementById("panel").style.display="none";
document.getElementById("custom").onclick=()=>document.getElementById("customPanel").style.display="block";
document.getElementById("closeCustom").onclick=()=>document.getElementById("customPanel").style.display="none";

document.getElementById("hudSize").oninput=e=>{const v=e.target.value;document.getElementById("hudVal").textContent=v+"%";document.getElementById("hudbox").style.transform=`scale(${v/100})`;document.getElementById("hudbox").style.transformOrigin="top left"};
document.getElementById("ctrlSize").oninput=e=>{const v=e.target.value;document.getElementById("ctrlVal").textContent=v+"%";["joystick","run","actions"].forEach(id=>document.getElementById(id).style.transform=id==="actions"?`translateX(-50%) scale(${v/100})`:`scale(${v/100})`)};
document.getElementById("sens").oninput=e=>{camSens=+e.target.value;document.getElementById("sensVal").textContent=camSens.toFixed(1)};
document.getElementById("camDist").oninput=e=>{camDist=+e.target.value;document.getElementById("camVal").textContent=camDist};
document.getElementById("hideHud").onclick=()=>{hudVisible=!hudVisible;document.getElementById("hud").style.display=hudVisible?"block":"none"};

document.getElementById("quality").onchange=e=>{
  const q=e.target.value;renderer.setPixelRatio(q==="high"?Math.min(devicePixelRatio,1.7):q==="medium"?Math.min(devicePixelRatio,1.2):.8);
  sun.shadow.mapSize.set(q==="high"?1024:q==="medium"?512:256);
};
document.getElementById("weatherSelect").onchange=e=>setWeather(e.target.value);

document.getElementById("heightVal").textContent="1.0";
document.getElementById("cHeight").oninput=e=>document.getElementById("heightVal").textContent=(+e.target.value).toFixed(2);
document.getElementById("applyCustom").onclick=()=>{
  player.userData.name=document.getElementById("cName").value||"Jugador";
  player.userData.sex=document.getElementById("cSex").value;
  player.scale.y=+document.getElementById("cHeight").value;
  player.children.forEach(o=>{if(o.material)o.material.color.set(o.material.color.getHex())});
  // identify body parts by approximate positions
  player.traverse(o=>{
    if(!o.material)return;
    if(o.geometry.type==="SphereGeometry" && o.position.y>3) o.material.color.set(document.getElementById("cHair").value);
  });
  // recreate the player's appearance cleanly
  world.remove(player);
  player=human({
    name:player.userData.name,
    skin:parseInt(document.getElementById("cSkin").value.slice(1),16),
    hair:parseInt(document.getElementById("cHair").value.slice(1),16),
    shirt:parseInt(document.getElementById("cShirt").value.slice(1),16),
    pants:parseInt(document.getElementById("cPants").value.slice(1),16),
    scale:1,
    female:document.getElementById("cSex").value==="Mujer"
  });
  player.userData.isPlayer=true;player.scale.y=+document.getElementById("cHeight").value;world.add(player);
  document.getElementById("customPanel").style.display="none";showMsg("ð¤ Personaje actualizado: "+player.userData.name);
};

let rain=null;
function setWeather(type){
  if(rain){scene.remove(rain);rain=null}
  if(type==="rain"){
    const geo=new THREE.BufferGeometry(),pos=[];
    for(let i=0;i<1600;i++){pos.push((Math.random()-.5)*180,Math.random()*80+5,(Math.random()-.5)*180)}
    geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
    rain=new THREE.Points(geo,new THREE.PointsMaterial({color:0xaadfff,size:.12,transparent:true,opacity:.75}));
    scene.add(rain);
    document.getElementById("weather").textContent="ð§ï¸ Lluvia";
  }else if(type==="cloud")document.getElementById("weather").textContent="âï¸ Nublado";
  else document.getElementById("weather").textContent="âï¸ Soleado";
}
setWeather("clear");

let audioCtx=null,master=null;
function startSound(){
  if(audioCtx){master.gain.value=master.gain.value>.01?0:.07;document.getElementById("sound").textContent=master.gain.value?". ð Sonido":"ð Silenciar";return}
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.05;master.connect(audioCtx.destination);
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.value=90;gain.gain.value=.15;osc.connect(gain);gain.connect(master);osc.start();
  document.getElementById("sound").textContent="ð Sonido";
}
document.getElementById("sound").onclick=startSound;

document.getElementById("saveBtn").onclick=()=>{
  const save={x:player.position.x,z:player.position.z,yaw,night,name:player.userData.name};
  localStorage.setItem("mundoVivoV10",JSON.stringify(save));showMsg("ð¾ Partida guardada");
};
document.getElementById("loadBtn").onclick=()=>{
  const s=JSON.parse(localStorage.getItem("mundoVivoV10")||"null");
  if(!s)return showMsg("No hay partida guardada.");
  player.position.set(s.x,0,s.z);yaw=s.yaw||0;if(s.night!==night)document.getElementById("day").click();showMsg("â©ï¸ Partida cargada");
};

function animatePeople(t){
  for(const p of people){
    const target=p.userData.target;
    const d=p.position.distanceTo(target);
    if(d<2){p.userData.target.set((Math.random()-.5)*220,0,(Math.random()-.5)*220)}
    const dir=target.clone().sub(p.position);dir.y=0;
    if(dir.length()>1){dir.normalize();p.position.addScaledVector(dir,p.userData.speed);p.rotation.y=Math.atan2(dir.x,dir.z)}
  }
}
function animateCars(){
  for(const c of cars){
    c.position.x+=c.userData.speed*c.userData.dir;
    if(c.position.x>125)c.position.x=-125;
    if(c.position.x<-125)c.position.x=125;
  }
}
function animateAnimals(){
  for(const a of animals){
    a.rotation.y+=Math.sin(performance.now()*.001+a.userData.phase)*.002;
    a.position.x+=Math.sin(performance.now()*.0004+a.userData.phase)*a.userData.speed;
  }
}
function updateHUD(){
  document.getElementById("stats").innerHTML=`ð¤ TÃº: ${player.userData.name||"Jugador"} &nbsp; â¤ï¸ 100% &nbsp; ð 10 &nbsp; ð§ 100%<br>Habitantes: ${people.length+1} &nbsp; Casas: ${houses.length} &nbsp; Autos: ${cars.length} &nbsp; Animales: ${animals.length}`;
}
function loop(t){
  requestAnimationFrame(loop);
  movePlayer();
  if(inCar){player.position.copy(inCar.position);player.position.y=.05;inCar.rotation.y=player.rotation.y}
  animatePeople(t);animateCars();animateAnimals();
  if(rain){
    const a=rain.geometry.attributes.position.array;
    for(let i=1;i<a.length;i+=3){a[i]-=.8;if(a[i]<0)a[i]=85}
    rain.geometry.attributes.position.needsUpdate=true;
  }
  updateCamera();updateHUD();renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
updateHUD();loop(0);
</script>
